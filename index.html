<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot sống sót</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        z-index: 1;
        top: 16px;
        left: 16px;
        display: grid;
        gap: 8px;
        padding: 12px 16px;
        color: white;
        background: rgb(15 23 42 / 80%);
        border-radius: 10px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <aside class="hud" aria-label="Trạng thái trò chơi">
      <span>❤️ HP: <strong id="hp">100</strong></span>
      <span>🪙 Coin: <strong id="coin-count">0</strong></span>
      <span>⏱ <strong id="timer">0</strong> / 60 sec</span>
    </aside>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
